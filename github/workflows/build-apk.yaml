
name: Build StoryCraft Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          mkdir android-src
          ZIP_FILE=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Android project ZIP not found"
            exit 1
          fi
          unzip "$ZIP_FILE" -d android-src

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          WRAPPER=$(find android-src -name gradlew -type f | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$WRAPPER")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoryCraft-Android-APK
          path: android-src/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
